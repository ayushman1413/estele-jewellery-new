name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "app/,bootstrap/,config/,database/,lang/,public/,resources/,routes/,storage/app/,storage/framework/,composer.json,composer.lock,artisan,.htaccess"
          target: ~/domains/shreyasproducts.com/public_html/estele/
          overwrite: true
          strip_components: 0

      - name: Post-deploy commands
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/domains/shreyasproducts.com/public_html/estele
            /opt/alt/php85/usr/bin/php artisan config:clear
            /opt/alt/php85/usr/bin/php artisan route:clear
            /opt/alt/php85/usr/bin/php artisan view:clear
            /opt/alt/php85/usr/bin/php artisan optimize
            /opt/alt/php85/usr/bin/php artisan view:cache
            /opt/alt/php85/usr/bin/php artisan event:cache
